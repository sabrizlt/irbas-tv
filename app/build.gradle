plugins {
    id 'com.android.application'
}

android {
    namespace 'it.irbas.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'it.irbas.tv'
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName '0.5'
    }

    // Su GitHub l'app viene firmata con la chiave del progetto (segreti del repository).
    // Senza chiave (compilazione sul Mac) si usa quella di prova, come prima.
    signingConfigs {
        release {
            def keystore = System.getenv('IRBAS_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('IRBAS_KEYSTORE_PASSWORD')
                keyAlias 'irbas'
                keyPassword System.getenv('IRBAS_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('IRBAS_KEYSTORE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // per il QR code del telecomando sul telefono
    implementation 'com.google.zxing:core:3.5.3'
}
