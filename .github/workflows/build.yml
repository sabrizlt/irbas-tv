name: Compila Irbas TV

# Ogni nuova versione (tag "v0.5", "v0.6"…) GitHub compila l'app e la mette tra i download.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Chiave di firma (dai segreti del repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/irbas-tv.jks"
            echo "IRBAS_KEYSTORE=$RUNNER_TEMP/irbas-tv.jks" >> "$GITHUB_ENV"
          else
            echo "Nessuna chiave: firmo con quella di prova"
          fi

      - name: Compila
        env:
          IRBAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Prepara i download
        run: |
          cp app/build/outputs/apk/release/app-release.apk IrbasTV.apk
          echo "${{ github.repository }}" > windows/repo.txt
          (cd windows && zip -q ../Installa-Irbas-TV-Windows.zip *)

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            IrbasTV.apk
            Installa-Irbas-TV-Windows.zip
          make_latest: true
          generate_release_notes: true
